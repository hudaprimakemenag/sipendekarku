<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Shield / Pentagon -->
  <polygon points="50,4 95,28 80,88 20,88 5,28" fill="#059669" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Inner Gold Border -->
  <polygon points="50,8 90,30 76,84 24,84 10,30" fill="#047857" stroke="#fbbf24" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Five Point Star at Top -->
  <polygon points="50,13 52.5,20 60,20 54,24.5 56.5,31.5 50,27 43.5,31.5 46,24.5 40,20 47.5,20" fill="#fbbf24"/>

  <!-- Golden Rays / Sunburst Circle -->
  <circle cx="50" cy="46" r="22" fill="#065f46" stroke="#f59e0b" stroke-width="1"/>
  
  <!-- Quran / Book of Knowledge (Open Book) -->
  <path d="M 50,49 Q 40,43 30,46 L 30,57 Q 40,54 50,58 Q 60,54 70,57 L 70,46 Q 60,43 50,49 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="0.8"/>
  <path d="M 50,49 L 50,58" stroke="#047857" stroke-width="1"/>

  <!-- Scales of Justice (Timbangan) -->
  <!-- Center Pole -->
  <line x1="50" y1="31" x2="50" y2="48" stroke="#fbbf24" stroke-width="2"/>
  <!-- Beam -->
  <line x1="36" y1="36" x2="64" y2="36" stroke="#fbbf24" stroke-width="1.5"/>
  <!-- Left Pan Strings & Pan -->
  <line x1="36" y1="36" x2="31" y2="43" stroke="#fde68a" stroke-width="0.8"/>
  <line x1="36" y1="36" x2="41" y2="43" stroke="#fde68a" stroke-width="0.8"/>
  <path d="M 29,43 Q 36,47 43,43 Z" fill="#fbbf24"/>
  <!-- Right Pan Strings & Pan -->
  <line x1="64" y1="36" x2="59" y2="43" stroke="#fde68a" stroke-width="0.8"/>
  <line x1="64" y1="36" x2="69" y2="43" stroke="#fde68a" stroke-width="0.8"/>
  <path d="M 57,43 Q 64,47 71,43 Z" fill="#fbbf24"/>

  <!-- Paddy (Padi) on Left & Cotton (Kapas) on Right Wreath -->
  <!-- Left Padi Garland (Yellow/Gold) -->
  <path d="M 22,76 C 16,56 22,36 30,28" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right Kapas Garland (White/Green) -->
  <path d="M 78,76 C 84,56 78,36 70,28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 78,76 C 84,56 78,36 70,28" fill="none" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2,3"/>

  <!-- Banner Ribbon / Pita IKHLAS BERAMAL -->
  <path d="M 18,72 Q 50,82 82,72 L 85,80 Q 50,91 15,80 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  
  <!-- Ribbon Tails -->
  <polygon points="15,80 18,72 10,75" fill="#e2e8f0" stroke="#f59e0b" stroke-width="0.6"/>
  <polygon points="85,80 82,72 90,75" fill="#e2e8f0" stroke="#f59e0b" stroke-width="0.6"/>

  <!-- Text IKHLAS BERAMAL on Ribbon -->
  <text x="50" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="5.2" fill="#047857" letter-spacing="0.4">IKHLAS BERAMAL</text>
</svg>
